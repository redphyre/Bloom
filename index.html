<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- MODIFIED VIEWPORT META TAG for portrait orientation lock (iOS/PWA compatibility) -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bloom - Dilation Tracking</title>

    <!-- PWA / Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- MODIFIED: Use black-translucent to blend the status bar into the web content -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bloom">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="icon" type="image/png" href="https://thebrainwire.com/bloom/bloom-icon-trans-3x.png">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configure Tailwind to enable dark mode based on a 'dark' class on the body -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'gray-950': '#0a0a0a',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles for Print & Scrollbar -->
    <style>
        /* BASE STYLES - Theme independent */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100%);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media print {
            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            body {
                background: white;
            }
        }

        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            /* Prevents pull-to-refresh on mobile */
            transition: background-color 0.3s;
        }

        input[type="date"],
        input[type="datetime-local"] {
            -webkit-appearance: none;
            appearance: none;
            min-height: 3rem;
            /* Matches h-12 */
        }

        /* Dark Mode Slider Styling for Aesthetics */
        .toggle-switch {
            width: 4rem;
            height: 2rem;
            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-knob {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 9999px;
            transition: all 0.3s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-switch.dark {
            background-color: #8b5cf6;
            /* Purple-500 */
        }

        .toggle-switch.light {
            background-color: #f3f4f6;
            /* Gray-100 */
        }

        .toggle-switch.light .toggle-knob {
            transform: translateX(0);
            background-color: #fca5a5;
            /* Pink-300 */
        }

        .toggle-switch.dark .toggle-knob {
            transform: translateX(2rem);
            /* Move 1.5rem knob + 0.5rem margin */
            background-color: #fef3c7;
            /* Amber-100 */
        }

        .toggle-knob svg {
            transition: opacity 0.3s;
        }

        /* --- IOS SAFEA AREA FIXES --- */
        /* 2. Modified: Apply padding to compensate for the home indicator bar in the fixed navbar */
        .pwa-safe-bottom {
            padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            /* 1rem for existing padding + safe area */
        }

        /* MODIFIED: Changed the definition of pwa-content-offset to include a base padding (1.5rem/pt-6) */
        .pwa-content-offset {
            /* Ensures content starts below the status bar (notch area) PLUS 1.5rem base padding */
            padding-top: calc(1.5rem + env(safe-area-inset-top));
        }

        /* NEW: Class for sticky headers. Combines standard padding (1rem/p-4) with safe area inset. */
        .pwa-sticky-top-pad {
            padding-top: calc(1rem + env(safe-area-inset-top));
        }

        /* NEW: Class for absolutely positioned elements that need to clear the status bar */
        .pwa-safe-absolute-top {
            top: calc(0.5rem + env(safe-area-inset-top));
            /* Using 0.5rem (8px) base margin instead of 1rem (16px) for absolute buttons to be tighter */
        }

        /* --- PORTRAIT FIX: Hide content if orientation is landscape, now handled by React/JSX/State --- */
        /* We keep this block simple to only hide the main content div based on landscape orientation */
        @media only screen and (orientation: landscape) {
            body>#root>.app-content {
                display: none !important;
            }
        }

        /* ... existing styles ... */

        /* FIX FOR iOS DATE ALIGNMENT */
        input[type="date"]::-webkit-date-and-time-value {
            text-align: left;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 h-screen overflow-hidden selection:bg-purple-200">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- THEME CONSTANTS ---
        const LIGHT_LOGO = "https://thebrainwire.com/bloom/bloom-logo-new-trans-3x-light.png";
        const DARK_LOGO = "https://thebrainwire.com/bloom/bloom-logo-new-trans-3x-dark.png";

        // --- Icons Component (Replaces Lucide-React for single file portability) ---
        const Icon = ({ name, className, ...props }) => {
            const icons = {
                heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
                settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l-.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l-.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />,
                plus: <path d="M5 12h14 M12 5v14" />,
                minus: <path d="M5 12h14" />, // ADDED MINUS ICON
                history: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5 M12 7v5l4 2" />,
                chevronLeft: <path d="m15 18-6-6 6-6" />,
                chevronDown: <path d="m6 9 6 6 6-6" />,
                check: <path d="M20 6 9 17l-5-5" />,
                play: <path d="M5 3l14 9-14 9V3z" />,
                pause: <path d="M6 4h4v16H6zm8 0h4v16h-4z" />,
                alertTriangle: <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z M12 9v4 M12 17h.01" />,
                syringe: (
                    <g>
                        <path d="m18 2 4 4" />
                        <path d="m17 7 3-3" />
                        <path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5" />
                        <path d="m9 11 4 4" />
                        <path d="m5 19-3 2" />
                        <path d="m14 4 6 6" />
                    </g>
                ),
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-3-2v-4 M7 10l5 5 5-5 M12 15V3" />,
                x: <path d="M18 6 6 18 M6 6l12 12" />,
                activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                frown: <g><circle cx="12" cy="12" r="10" /><path d="M16 16s-1.5-2-4-2-4 2-4 2 M9 9h.01 M15 9h.01" /></g>,
                trash2: <path d="M3 6h18 M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6 M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2 M10 11v6 M14 11v6" />,
                filetext: <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8" />,
                sun: <path d="M12 2v1 M12 21v1 M4.22 4.22l.71.71 M18.07 18.07l.71.71 M1 12h1 M21 12h1 M4.22 19.78l.71-.71 M18.07 5.93l.71-.71 M8 12a4 4 0 1 0 8 0 4 4 0 0 0-8 0z" />,
                moon: <path d="M12 3a6.36 6.36 0 0 0 9 9 9 9 0 1 1-8.53-8.56Z" />,
                // New Icon for Landscape Warning (Screen Rotate)
                rotateCw: <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8 M21 3v5h-5 M12 16v-4l-4-2" />,
                // A simplified phone/tablet icon for the warning
                tabletLandscape: <rect width="20" height="15" x="2" y="4.5" rx="3" ry="3" />,
            };

            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24" height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                    {...props}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        // --- Landscape Warning Component ---
        const LandscapeWarning = ({ isDark }) => (
            <div className={`fixed inset-0 flex flex-col items-center justify-center p-8 text-center transition-colors duration-500 z-50 ${isDark
                ? 'bg-gray-900 text-gray-50'
                : 'bg-gray-50 text-gray-900'
                }`}>
                <div className="mb-6">
                    {/* MODIFIED SVG: Using a simple vertical phone/tablet shape */}
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className="mx-auto" stroke="currentColor">
                        {/* Vertical Phone/Tablet Outline */}
                        <rect x="7" y="2" width="10" height="20" rx="2" strokeWidth="2" className="stroke-purple-400" />
                        {/* Home Button/Indicator Dot */}
                        <circle cx="12" cy="19" r="1" fill="currentColor" className="fill-purple-400" />
                    </svg>
                </div>
                <h1 className={`text-2xl font-bold mb-3 ${isDark ? 'text-gray-100' : 'text-gray-900'}`}>
                    Please Rotate Device
                </h1>
                <p className={`text-base ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>
                    Bloom is optimized for portrait view only.
                </p>
            </div>
        );


        // --- Logo Component (Kept for completeness, though not used for the theme logic) ---
        const BloomLogo = ({ className = "w-10 h-10" }) => (
            <svg viewBox="0 0 100 100" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bloomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#ec4899" />
                        <stop offset="100%" stopColor="#8b5cf6" />
                    </linearGradient>
                </defs>
                <path d="M50 20 H 65 C 85 20, 85 50, 65 50 H 55 V 20 Z" fill="url(#bloomGradient)" />
                <path d="M55 50 H 68 C 90 50, 90 85, 68 85 H 50 V 50 Z" fill="url(#bloomGradient)" />
                <path d="M45 20 C 25 20, 15 35, 45 50 C 45 40, 48 25, 45 20 Z" fill="url(#bloomGradient)" opacity="0.9" />
                <path d="M10 52 C 10 40, 35 45, 48 52 C 35 60, 10 65, 10 52 Z" fill="url(#bloomGradient)" opacity="0.8" />
                <path d="M45 85 C 25 85, 15 70, 45 55 C 45 65, 48 80, 45 85 Z" fill="url(#bloomGradient)" opacity="0.9" />
            </svg>
        );

        // --- Helpers ---
        const formatDate = (isoString) => {
            if (!isoString) return '';
            try {
                return new Date(isoString).toLocaleDateString('en-US', {
                    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
                });
            } catch (e) {
                return '';
            }
        };

        const formatWeekHeader = (dateString) => {
            try {
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            } catch (e) {
                return '';
            }
        };

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        const calculateSurgeryAge = (dateString) => {
            if (!dateString) return null;
            const surgery = new Date(dateString);
            if (isNaN(surgery.getTime())) return null;

            const now = new Date();
            const diffTime = Math.abs(now - surgery);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const months = Math.floor(diffDays / 30.44);
            const days = Math.floor(diffDays % 30.44);

            return { totalDays: diffDays, text: `${months}m ${days}d` };
        };

        const formatTimeSafe = (dateString) => {
            try {
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
            } catch (e) {
                return '';
            }
        };

        // --- Sound Helper ---
        const playCompletionSound = () => {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.connect(gain);
            gain.connect(ctx.destination);

            // Gentle Sine Wave Chime
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, t); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.5, t + 0.1); // C6

            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 2);

            osc.start(t);
            osc.stop(t + 2);
        };

        // --- DEMO DATA CONSTANT ---
        const DILATOR_BREAKDOWNS = [
            // 20 minutes total (in seconds)
            // 1. Balanced progression (S, M, L)
            { S: 5 * 60, M: 10 * 60, L: 5 * 60 },
            // 2. Focused on Medium (M, L)
            { S: 0, M: 12 * 60, L: 8 * 60 },
            // 3. Difficult day, staying mostly Small (S, M)
            { S: 10 * 60, M: 10 * 60, L: 0 },
            // 4. Advanced, mostly Large
            { S: 3 * 60, M: 5 * 60, L: 12 * 60 },
            // 5. Short progression to large
            { S: 3 * 60, M: 4 * 60, L: 13 * 60 },
        ];

        const MOOD_COMBINATIONS = [
            ['Relieved', 'Proud'],
            ['Happy', 'Peaceful'],
            ['Tired', 'Uncomfortable'],
            ['Anxious', 'Uncomfortable', 'Relieved'],
            ['Proud', 'Happy', 'Relieved'],
        ];

        const SESSION_NOTES = [
            "Good session today, felt minimal resistance on the last size.",
            "A bit of soreness afterward, but overall very successful. Hit target time easily.",
            "Tough start, had to repeat the medium size twice before moving on.",
            "Felt a big sense of relief once finished. The new position helped immensely.",
            "No major issues. Notes for tomorrow: try to reduce small size time.",
            "Very tired today, almost skipped, but glad I powered through. Low pain scores.",
        ];

        const getRandomElement = (arr) => arr[Math.floor(Math.random() * arr.length)];

        const LOAD_DEMO_DATA = () => {
            // Calculate a surgery date roughly 4 months ago for varied "Post-Op" display
            const now = new Date();
            const surgeryDate = new Date(now);
            surgeryDate.setMonth(now.getMonth() - 4);
            const surgeryDateIso = surgeryDate.toISOString().split('T')[0];
            
            // Generate session dates (last week)
            const sessions = [];
            const dayInMs = 24 * 60 * 60 * 1000;
            
            // Start from 7 days ago 
            for (let i = 7; i >= 1; i--) {
                const date = new Date(now.getTime() - i * dayInMs);
                const dateIso = date.toISOString();
                
                // Completed session
                if (i !== 3 && i !== 6) { // Skip two random days for missed/emergency
                    sessions.push({
                        id: date.getTime(),
                        date: dateIso,
                        duration: 20 * 60, // Fixed duration for simplicity
                        breakdown: getRandomElement(DILATOR_BREAKDOWNS),
                        pain: Math.floor(Math.random() * 3), // Low pain
                        pressure: Math.floor(Math.random() * 4), // Moderate pressure
                        mood: getRandomElement(MOOD_COMBINATIONS),
                        notes: getRandomElement(SESSION_NOTES),
                        surgeryAge: 'Demo Age',
                    });
                }
                
                // Missed session on day 3
                if (i === 3) {
                    sessions.push({
                        id: date.getTime() + 1,
                        date: dateIso,
                        duration: 0,
                        breakdown: { S: 0, M: 0, L: 0 },
                        pain: 0,
                        pressure: 0,
                        mood: ['Skipped'],
                        notes: `Skipped due to being sick/flu symptoms.`,
                        surgeryAge: 'Demo Age',
                        isMissed: true
                    });
                }

                // Emergency stop on day 6
                if (i === 6) {
                    sessions.push({
                        id: date.getTime() + 2,
                        date: dateIso,
                        duration: 12 * 60, // 12 minutes only
                        breakdown: { S: 5 * 60, M: 7 * 60, L: 0 },
                        pain: 9, 
                        pressure: 8,
                        mood: ['Emergency'],
                        notes: `Emergency stop: High pain/bleeding noted when attempting to transition to next size.`,
                        surgeryAge: 'Demo Age',
                        isEmergency: true,
                        emergencyReason: 'High Pain'
                    });
                }
            }

            // Injections (last two weeks)
            const injections = [
                { id: 3, date: new Date(now.getTime() - 2 * dayInMs).toISOString(), site: 'Left Thigh' },
                { id: 2, date: new Date(now.getTime() - 9 * dayInMs).toISOString(), site: 'Right Thigh' },
                { id: 1, date: new Date(now.getTime() - 15 * dayInMs).toISOString(), site: 'Stomach' },
            ];

            return {
                sessions: sessions.sort((a, b) => new Date(b.date) - new Date(a.date)),
                injections: injections.sort((a, b) => new Date(b.date) - new Date(a.date)),
                settings: {
                    surgeryDate: surgeryDateIso,
                    targetTime: 20,
                    dailyTarget: 3,
                    name: 'Test Patient',
                    injectionSites: ['Left Thigh', 'Right Thigh', 'Stomach'],
                    isSetupComplete: true,
                    theme: 'light',
                }
            };
        };
        // --- END DEMO DATA CONSTANT ---

        // --- Main App ---
        function BloomApp() {
            const [activeTab, setActiveTab] = useState('home');
            const [isLandscape, setIsLandscape] = useState(false); // State for orientation

            // --- Robust Persistence: Lazy Initialization ---
            const [sessions, setSessions] = useState(() => {
                const saved = localStorage.getItem('bloom_sessions');
                return saved ? JSON.parse(saved) : [];
            });

            const [injections, setInjections] = useState(() => {
                const saved = localStorage.getItem('bloom_injections');
                return saved ? JSON.parse(saved) : [];
            });

            const [userSettings, setUserSettings] = useState(() => {
                const saved = localStorage.getItem('bloom_settings');
                const defaults = {
                    surgeryDate: '',
                    targetTime: 20,
                    dailyTarget: 3,
                    name: '',
                    injectionSites: [],
                    isSetupComplete: false,
                    theme: 'light', // ADDED THEME SETTING
                };
                // Merge defaults with saved data to ensure new fields (like dailyTarget) are populated for existing users
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // If returning user has a name, assume setup is complete
                    const isSetup = parsed.isSetupComplete || (parsed.name && parsed.name !== 'Patient');
                    // Ensure theme defaults to 'light' if not saved
                    return { ...defaults, ...parsed, isSetupComplete: isSetup, theme: parsed.theme || 'light' };
                }
                return defaults;
            });

            // Session State
            const [isSessionActive, setIsSessionActive] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [activeSize, setActiveSize] = useState(null);
            const [sessionTimer, setSessionTimer] = useState(0);
            const [sizeTimers, setSizeTimers] = useState({ S: 0, M: 0, L: 0 });
            const [showAftercare, setShowAftercare] = useState(false);

            // Manual Log State
            const [showManualEntry, setShowManualEntry] = useState(false);
            const [manualEntry, setManualEntry] = useState({
                date: '',
                duration: 20,
                type: 'completed',
                notes: '',
                pain: 0,
                pressure: 0,
                mood: [] // ADDED MOOD ARRAY
            });

            // Emergency Stop State
            const [showEmergencyModal, setShowEmergencyModal] = useState(false);
            const [emergencyData, setEmergencyData] = useState({
                reason: '',
                notes: ''
            });

            // History Grouping State
            const [expandedWeeks, setExpandedWeeks] = useState({});

            // Injection Modal States
            const [showInjectionSetup, setShowInjectionSetup] = useState(false);
            const [showInjectionSelector, setShowInjectionSelector] = useState(false);
            const [tempInjectionSites, setTempInjectionSites] = useState([]);

            // Aftercare State
            const [aftercareData, setAftercareData] = useState({
                pain: 0,
                pressure: 0,
                mood: [],
                notes: ''
            });

            // Persistence: Save on change
            useEffect(() => {
                localStorage.setItem('bloom_sessions', JSON.stringify(sessions));
                localStorage.setItem('bloom_settings', JSON.stringify(userSettings));
                localStorage.setItem('bloom_injections', JSON.stringify(injections));
            }, [sessions, userSettings, injections]);

            // --- ORIENTATION EFFECT ---
            useEffect(() => {
                const checkOrientation = () => {
                    // Check if it is a mobile device to enforce portrait mode
                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                    
                    // If it's mobile and width > height, show warning. Otherwise (PC/Desktop), allow it.
                    if (isMobile) {
                        setIsLandscape(window.innerWidth > window.innerHeight); 
                    } else {
                        setIsLandscape(false);
                    }
                };

                checkOrientation();
                window.addEventListener('resize', checkOrientation);
                window.addEventListener('orientationchange', checkOrientation); // For mobile orientation changes

                return () => {
                    window.removeEventListener('resize', checkOrientation);
                    window.removeEventListener('orientationchange', checkOrientation);

            // --- END ORIENTATION EFFECT ---

                    body.classList.add('dark');

                    body.classList.add('bg-gray-950', 'text-gray-100');

                if (isSessionActive && activeSize && !isPaused && !showEmergencyModal && sessionTimer < targetSeconds) {
                    interval = setInterval(() => {
                        setSessionTimer(prev => prev + 1);
                        setSizeTimers(prev => ({
                            ...prev,
                            [activeSize]: prev[activeSize] + 1

                    }, 1000);

                return () => clearInterval(interval);

            // Completion Effect (Sound Only)
            useEffect(() => {
                const targetSeconds = userSettings.targetTime * 60;
                // Check if session is active and we just hit the target (or jumped past it)
                if (isSessionActive && sessionTimer >= targetSeconds && sessionTimer > 0) {
                    playCompletionSound();

                    // Auto-stop session when target time is reached
                    if (sessionTimer >= targetSeconds) {

                setIsSessionActive(true);
                setIsPaused(false);

                const confirmCustomModal = (title, message, onConfirm) => {
                    return window.confirm(message); // returns true on OK, false on Cancel
                };

                // If there is no timer data, just cancel immediately without alert
                if (sessionTimer === 0) {
                    setIsSessionActive(false);
                    setIsPaused(false);
                    setActiveSize(null);
                    setSessionTimer(0);
                    setSizeTimers({ S: 0, M: 0, L: 0 });
                    setActiveTab('home');
                    return;
                }

                // If timer has run, ask for confirmation
                const isConfirmed = confirmCustomModal("Cancel this session?", "Are you sure you want to cancel? Progress will be lost.");

                // If confirmed (OK is pressed)
                if (isConfirmed) {
                    setIsSessionActive(false);
                    setIsPaused(false);
                    setActiveSize(null);
                    setSessionTimer(0);
                    setSizeTimers({ S: 0, M: 0, L: 0 });
                    setActiveTab('home');

                // If not confirmed (Cancel is pressed), the function simply returns, leaving the session active/paused.
            };

                    return {
                        ...prev,
                        [weekKey]: newValue
                    };
                });
            };

            const handleExpandAll = () => {
                setExpandedWeeks({}); // Resetting to empty means everything uses default (true)
            };

            const handleCollapseAll = () => {
                const groupedSessions = sessions.reduce((acc, session) => {
                    const date = new Date(session.date);
                    // Get beginning of week (Sunday)
                    const day = date.getDay();
                    const diff = date.getDate() - day;
                    const weekStart = new Date(date);
                    weekStart.setDate(diff);
                    weekStart.setHours(0, 0, 0, 0);
                    const key = weekStart.toDateString();
                    if (!acc[key]) acc[key] = [];
                    acc[key].push(session);
                    return acc;
                }, {});
                const allCollapsed = Object.keys(groupedSessions).reduce((acc, week) => ({ ...acc, [week]: false }), {});
                setExpandedWeeks(allCollapsed);

                                            {formatTimeSafe(inj.date)}
                                        </span>
                                    </p>
                                    <p className="text-sm text-gray-500 dark:text-gray-400">{inj.site}</p>
                                </div>
                            </div>
                        ))}
                        {injections.length === 0 && <p className="text-center text-gray-400 dark:text-gray-500">No injection logs found.</p>}
                    </div>
                </div>
            );

            // --- New Components for Injections ---
            const renderInjectionSetup = () => (
                <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                        <h2 className="text-xl font-bold text-gray-900 dark:text-gray-50 mb-2">One-time Setup</h2>
                        <p className="text-gray-500 dark:text-gray-400 mb-6">Where do you normally inject? We'll save this for next time.</p>

                        <div className="space-y-3 mb-8">
                            {['Left Thigh', 'Right Thigh', 'Stomach', 'Glutes', 'Arm'].map(site => (
                                <button
                                    key={site}
                                    onClick={() => toggleTempSite(site)}
                                    className={`w-full p-4 rounded-xl border-2 flex justify-between items-center transition-all ${tempInjectionSites.includes(site)
                                        ? 'border-pink-500 bg-pink-50 dark:bg-pink-900/50 text-pink-700 dark:text-pink-300 font-semibold'
                                        : 'border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-200'
                                        }`}
                                >
                                    {site}
                                    {tempInjectionSites.includes(site) && <Icon name="check" className="w-5 h-5 text-pink-500" />}
                                </button>
                            ))}
                        </div>

                        <button
                            onClick={saveInjectionPreferences}
                            className="w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-transform"
                        >
                            Save Preferences
                        </button>
                    </div>
                </div>
            );

            const renderInjectionSelector = () => (
                <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl mb-20 sm:mb-0">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-gray-900 dark:text-gray-50">Log Injection</h2>
                            <button onClick={() => setShowInjectionSelector(false)} className="p-2 bg-gray-100 dark:bg-gray-700 rounded-full text-gray-600 dark:text-gray-300"><Icon name="x" className="w-4 h-4" /></button>
                        </div>
                        <p className="text-gray-500 dark:text-gray-400 mb-6 text-sm">Where did you inject today?</p>

                        <div className="space-y-3">
                            {(userSettings.injectionSites || []).map(site => (
                                <button
                                    key={site}
                                    onClick={() => confirmInjection(site)}
                                    className="w-full p-4 rounded-xl border border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-gray-50 font-semibold hover:bg-pink-50 dark:hover:bg-pink-900/50 hover:border-pink-200 dark:hover:border-pink-900 hover:text-pink-600 transition-colors text-left flex items-center gap-3"
                                >
                                    <div className="w-2 h-2 rounded-full bg-pink-400"></div>
                                    {site}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );


            const renderHistory = () => {
                // Calculate weeks for display
                const groupedSessions = sessions.reduce((acc, session) => {
                    const date = new Date(session.date);
                    const day = date.getDay();
                    const diff = date.getDate() - day;
                    const weekStart = new Date(date);
                    weekStart.setDate(diff);
                    weekStart.setHours(0, 0, 0, 0);
                    const key = weekStart.toDateString();
                    if (!acc[key]) acc[key] = [];
                    acc[key].push(session);
                    return acc;
                }, {});

                const sortedWeeks = Object.keys(groupedSessions).sort((a, b) => new Date(b) - new Date(a));

                return (
                    // ADDED pb-32 HERE: This creates space at the bottom so content clears the nav bar
                    <div className="pb-32 animate-fade-in relative">

                        {/* Fixed Header */}
                        <div className="fixed top-0 left-0 right-0 z-20 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 px-4 pb-3 pt-[calc(env(safe-area-inset-top)+1rem)] transition-all duration-300">
                            <div className="flex flex-col gap-2">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => setActiveTab('home')} className="p-2 -ml-2 text-gray-600 dark:text-gray-300 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700"><Icon name="chevronLeft" className="w-6 h-6" /></button>
                                        <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-50">History</h2>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={handleManualEntryClick} className="p-2 text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-gray-700 rounded-lg hover:bg-purple-100 dark:hover:bg-gray-600 mr-1"><Icon name="plus" className="w-5 h-5" /></button>
                                        <button onClick={exportData} className="p-2 text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-gray-700 rounded-lg hover:bg-purple-100 dark:hover:bg-gray-600"><Icon name="filetext" className="w-5 h-5" /></button>
                                        <button onClick={() => window.print()} className="p-2 text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600"><Icon name="download" className="w-5 h-5" /></button>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-4 text-xs font-semibold text-purple-600 dark:text-purple-400">
                                    <button onClick={handleExpandAll} className="hover:underline">Expand All</button>
                                    <button onClick={handleCollapseAll} className="hover:underline">Collapse All</button>
                                </div>
                            </div>
                        </div>

                        {/* Spacer */}
                        <div className="pt-[calc(env(safe-area-inset-top)+6.5rem)]"></div>

                        <div className="px-4 space-y-8">
                            {sessions.length === 0 && <div className="text-center text-gray-400 dark:text-gray-500 mt-10">No history yet. Start your first session!</div>}

                            {Object.keys(sessions).length > 0 && (
                                <div className="space-y-8">
                                    {sortedWeeks.map(weekKey => (
                                        <div key={weekKey} className="space-y-4">
                                            <button
                                                onClick={() => toggleWeek(weekKey)}
                                                className="flex items-center justify-between w-full text-left bg-gray-50 dark:bg-gray-800 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                                            >
                                                <span className="font-bold text-gray-500 dark:text-gray-400 text-sm uppercase tracking-wider">
                                                    Week of {formatWeekHeader(weekKey)}
                                                </span>
                                                <Icon
                                                    name="chevronDown"
                                                    className={`w-5 h-5 text-gray-400 dark:text-gray-500 transition-transform ${expandedWeeks[weekKey] === false ? '-rotate-90' : ''}`}
                                                />
                                            </button>

                                            {(expandedWeeks[weekKey] !== false) && (
                                                <div className="space-y-4 animate-fade-in">
                                                    {groupedSessions[weekKey].map(session => (
                                                        <div key={session.id} className={`bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border print:border print:shadow-none ${session.isEmergency ? 'border-red-100 dark:border-red-900 bg-red-50/30 dark:bg-red-900/10' : session.isMissed ? 'border-red-100 dark:border-red-900 bg-red-50/30 dark:bg-red-900/10' : 'border-gray-100 dark:border-gray-700'} relative`}>
                                                            <button
                                                                onClick={() => deleteSession(session.id)}
                                                                className="absolute top-3 right-3 p-1.5 text-gray-300 hover:text-red-500 bg-white/50 dark:bg-gray-800/50 hover:bg-red-50 rounded-full transition-colors z-10"
                                                                title="Delete Entry"
                                                            >
                                                                <Icon name="trash2" className="w-4 h-4" />
                                                            </button>
                                                            <div className="flex justify-between items-start mb-3 pr-8">
                                                                <div>
                                                                    <p className="font-bold text-gray-800 dark:text-gray-100">{formatDate(session.date)}</p>
                                                                    <p className="text-xs text-gray-500 dark:text-gray-400">{new Date(session.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} • {session.surgeryAge} Post-Op</p>
                                                                </div>
                                                                <div className="text-right">
                                                                    <span className={`block font-bold ${session.isEmergency || session.isMissed ? 'text-red-500 dark:text-red-400' : 'text-purple-600 dark:text-purple-400'}`}>{session.isEmergency ? 'STOP' : session.isMissed ? 'Missed' : Math.floor(session.duration / 60) + ' min'}</span>
                                                                    <span className="text-xs text-gray-400 dark:text-gray-500">Total</span>
                                                                </div>
                                                            </div>
                                                            {!session.isMissed && (
                                                                <div className="h-2 w-full bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden flex mb-3">
                                                                    {session.breakdown.S > 0 && <div style={{ width: `${(session.breakdown.S / session.duration) * 100}%` }} className={`${session.isEmergency ? 'bg-red-400' : 'bg-blue-400'} h-full`} />}
                                                                    {session.breakdown.M > 0 && <div style={{ width: `${(session.breakdown.M / session.duration) * 100}%` }} className={`${session.isEmergency ? 'bg-red-400' : 'bg-green-400'} h-full`} />}
                                                                    {session.breakdown.L > 0 && <div style={{ width: `${(session.breakdown.L / session.duration) * 100}%` }} className={`${session.isEmergency ? 'bg-red-400' : 'bg-orange-400'} h-full`} />}
                                                                    {(!session.breakdown.S && !session.breakdown.M && !session.breakdown.L) && <div className={`w-full ${session.isEmergency ? 'bg-red-400' : 'bg-purple-300'} h-full`} />}
                                                                </div>
                                                            )}

                                                            {!session.isMissed && (
                                                                <div className="grid grid-cols-2 gap-4 text-sm text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl mb-3">
                                                                    <div className="flex items-center gap-2"><Icon name="frown" className="w-4 h-4 text-gray-400 dark:text-gray-500" /><span>Pain: {session.pain}/10</span></div>
                                                                    <div className="flex items-center gap-2"><Icon name="activity" className="w-4 h-4 text-gray-400 dark:text-gray-500" /><span>Pressure: {session.pressure}/10</span></div>
                                                                </div>
                                                            )}

                                                            {session.isEmergency ? (
                                                                <div className="flex flex-col gap-1 mb-2 p-2 bg-red-100 dark:bg-red-900 rounded-lg border border-red-200 dark:border-red-950">
                                                                    <div className="flex items-center gap-2 text-red-700 dark:text-red-300 font-bold text-xs uppercase tracking-wider">
                                                                        <Icon name="alertTriangle" className="w-3 h-3" /> Emergency Stop
                                                                    </div>
                                                                    <p className="text-sm text-red-800 dark:text-red-200 font-medium">{session.emergencyReason}</p>
                                                                </div>
                                                            ) : session.mood.length > 0 && (
                                                                <div className="flex flex-wrap gap-2 mb-2">
                                                                    {session.mood.map(m => <span key={m} className={`text-xs px-2 py-1 rounded-md font-medium ${session.isMissed ? 'bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-300' : 'bg-pink-50 dark:bg-pink-900/50 text-pink-600 dark:text-pink-300'}`}>{m}</span>)}
                                                                </div>
                                                            )}
                                                            {session.notes && <p className="text-sm text-gray-500 dark:text-gray-400 italic mt-2 border-t border-gray-100 dark:border-gray-700 pt-2">"{session.notes}"</p>}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderSettings = () => (
                <div className="pb-32 px-6 animate-fade-in relative">

                    {/* Fixed Header */}
                    <div className="fixed top-0 left-0 right-0 z-20 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 px-6 pb-4 pt-[calc(env(safe-area-inset-top)+1rem)] transition-all duration-300">
                        <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-50">Settings</h2>
                    </div>

                    {/* Spacer */}
                    <div className="pt-[calc(env(safe-area-inset-top)+4.5rem)]"></div>

                    {/* Content */}
                    <div className="space-y-8">
                        {/* Theme Toggle */}
                        <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                            <div className="flex justify-between items-center">
                                <label className="text-sm font-medium text-gray-700 dark:text-gray-300">Appearance</label>
                                <div className="flex items-center gap-3">
                                    <div onClick={toggleTheme} className={`toggle-switch ${userSettings.theme}`}>
                                        <div className="toggle-knob shadow-md">
                                            {userSettings.theme === 'light' ? (
                                                <Icon name="sun" className="w-4 h-4 text-orange-600" />
                                            ) : (
                                                <Icon name="moon" className="w-4 h-4 text-gray-900" />
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Your Name</label>
                                <input type="text" value={userSettings.name} onChange={(e) => setUserSettings({ ...userSettings, name: e.target.value })} className="w-full h-12 p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-50 appearance-none" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Surgery Date</label>
                                {/* ADDED style prop to FORCE left alignment on iOS */}
                                <input
                                    type="date"
                                    value={userSettings.surgeryDate}
                                    onChange={(e) => setUserSettings({ ...userSettings, surgeryDate: e.target.value })}
                                    style={{ textAlign: 'left', WebkitAppearance: 'none' }}
                                    className="w-full h-12 p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-50 appearance-none"
                                />
                                <p className="text-xs text-gray-400 dark:text-gray-500 mt-1">Used to calculate your post-op timeline.</p>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Target Session Duration (Minutes)</label>
                                <input type="number" value={userSettings.targetTime} onChange={(e) => setUserSettings({ ...userSettings, targetTime: parseInt(e.target.value) })} className="w-full h-12 p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-50 appearance-none" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Daily Dilations Goal</label>
                                <input type="number" value={userSettings.dailyTarget} onChange={(e) => setUserSettings({ ...userSettings, dailyTarget: parseInt(e.target.value) })} className="w-full h-12 p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-50 appearance-none" />
                            </div>

                            <div className="pt-4 border-t border-gray-100 dark:border-gray-700">
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">Injection Sites</label>
                                <div className="space-y-2">
                                    {['Left Thigh', 'Right Thigh', 'Stomach', 'Glutes', 'Arm'].map(site => (
                                        <button
                                            key={site}
                                            onClick={() => toggleSettingSite(site)}
                                            className={`w-full p-3 rounded-xl border text-sm flex justify-between items-center transition-all ${(userSettings.injectionSites || []).includes(site)
                                                ? 'border-pink-500 bg-pink-50 dark:bg-pink-900/50 text-pink-700 dark:text-pink-300 font-semibold'
                                                : 'border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400'
                                                }`}
                                        >
                                            {site}
                                            {(userSettings.injectionSites || []).includes(site) && <Icon name="check" className="w-4 h-4 text-pink-500" />}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                        
                        {/* NEW: Demo Data Load Button */}
                        <div className="pt-8 border-t border-gray-100 dark:border-gray-700 space-y-4">
                            <button 
                                onClick={loadDemoData}
                                className="w-full text-blue-500 dark:text-blue-400 text-sm font-medium flex items-center justify-center gap-2 bg-blue-50 dark:bg-gray-700 py-3 rounded-xl hover:bg-blue-100 dark:hover:bg-gray-600 transition-colors"
                            >
                                <Icon name="download" className="w-4 h-4" /> Load Demo Data
                            </button>

                            <button onClick={() => {
                                if (window.confirm('Are you sure you want to clear all data?')) {
                                    localStorage.clear();
                                    window.location.reload();
                                }
                            }} className="text-red-500 dark:text-red-400 text-sm font-medium flex items-center gap-2"><Icon name="trash2" className="w-4 h-4" /> Reset All Data</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-gray-50 dark:bg-gray-900 shadow-2xl min-h-screen relative font-sans">
                    {/* Conditional Rendering of Landscape Warning or App Content */}
                    {isLandscape ? (
                        <LandscapeWarning isDark={userSettings.theme === 'dark'} />
                    ) : (
                        <div className="h-screen overflow-y-auto scrollbar-hide app-content">
                            {/* Conditionally render wizard OR main app */}
                            {!userSettings.isSetupComplete ? (
                                renderSetupWizard()
                            ) : (
                                <>
                                    {activeTab === 'home' && !isSessionActive && renderHome()}
                                    {activeTab === 'track' && (isSessionActive || showAftercare) && !showAftercare && renderActiveSession()}
                                    {activeTab === 'history' && !isSessionActive && renderHistory()}
                                    {activeTab === 'injections' && !isSessionActive && renderInjections()}
                                    {activeTab === 'settings' && !isSessionActive && renderSettings()}

                                    {/* Placeholder for safe scrolling */}
                                    <div className="h-0"></div>

                                    {showAftercare && renderAftercare()}
                                    {showManualEntry && renderManualEntryModal()}
                                    {showEmergencyModal && renderEmergencyModal()}
                                    {showInjectionSetup && renderInjectionSetup()}
                                    {showInjectionSelector && renderInjectionSelector()}

                                    {!isSessionActive && !showAftercare && (
                                        // Fixed Nav Bar with 1rem padding
                                        <div className="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-700 px-6 pt-4 pb-[calc(1rem+env(safe-area-inset-bottom))] flex justify-between items-center z-40 no-print transition-all duration-300">
                                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'home' ? 'text-purple-600 dark:text-purple-400' : 'text-gray-400 dark:text-gray-500'}`}>
                                                <Icon name="heart" className={`w-6 h-6 ${activeTab === 'home' ? 'fill-current' : ''}`} />
                                                <span className="text-[10px] font-medium">Home</span>
                                            </button>
                                            <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'history' ? 'text-purple-600 dark:text-purple-400' : 'text-gray-400 dark:text-gray-500'}`}>
                                                <Icon name="history" className={`w-6 h-6 ${activeTab === 'history' ? 'stroke-[2.5px] text-purple-600 dark:text-purple-400' : ''}`} />
                                                <span className="text-[10px] font-medium">History</span>
                                            </button>

                                            {/* Floating Start Button */}
                                            <button onClick={startSession} className="-mt-12 bg-gradient-to-tr from-purple-600 to-pink-500 text-white p-4 rounded-full shadow-lg hover:scale-105 transition-transform ring-4 ring-gray-50 dark:ring-gray-900">
                                                <Icon name="plus" className="w-8 h-8" />
                                            </button>

                                            <button onClick={() => setActiveTab('injections')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'injections' ? 'text-purple-600 dark:text-purple-400' : 'text-gray-400 dark:text-gray-500'}`}>
                                                <Icon name="syringe" className={`w-6 h-6 ${activeTab === 'injections' ? 'fill-current' : ''}`} />
                                                <span className="text-[10px] font-medium">Meds</span>
                                            </button>
                                            <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'settings' ? 'text-purple-600 dark:text-purple-400' : 'text-gray-400 dark:text-gray-500'}`}>
                                                <Icon name="settings" className={`w-6 h-6 ${activeTab === 'settings' ? 'fill-current' : ''}`} />
                                                <span className="text-[10px] font-medium">Settings</span>
                                            </button>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BloomApp />);
    </script>
</body>

</html>
